name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write   # needed to create GitHub Releases and upload assets

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle cache
      uses: gradle/actions/setup-gradle@v4

    - name: Decode signing keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

    - name: Build signed release APK
      env:
        KEYSTORE_FILE: ${{ runner.temp }}/release.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew clean assembleRelease --no-daemon --max-workers=2 --stacktrace

    - name: Validate release APK
      run: |
        test -s app/build/outputs/apk/release/app-release.apk
        ./gradlew testDebugUnitTest --no-daemon --max-workers=2 --stacktrace

    - name: Read version info
      id: version
      run: |
        CODE=$(grep "versionCode" app/build.gradle.kts | grep -o '[0-9]*')
        NAME=$(grep "versionName" app/build.gradle.kts | grep -o '"[^"]*"' | tr -d '"')
        echo "code=$CODE" >> $GITHUB_OUTPUT
        echo "name=$NAME" >> $GITHUB_OUTPUT
        echo "tag=v${NAME}+${CODE}" >> $GITHUB_OUTPUT

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/app-release.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: "Barcode To CSV ${{ steps.version.outputs.tag }}"
        body: |
          Barcode To CSV v${{ steps.version.outputs.name }} includes the refreshed Near Expiry Manager-inspired visual system, adaptive appearance modes, responsive dashboard cards, and hardened build tooling.

          Built and validated from commit ${{ github.sha }}.
        files: app/build/outputs/apk/release/app-release.apk
        make_latest: true
        overwrite: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
