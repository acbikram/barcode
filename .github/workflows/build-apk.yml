name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write   # needed to create GitHub Releases and upload assets

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle cache
      uses: gradle/actions/setup-gradle@v4

    - name: Decode signing keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

    - name: Validate migrations, lint, and test
      run: |
        python3 tools/verify_migrations.py
        ./gradlew lintDebug testDebugUnitTest --no-daemon --max-workers=1 --stacktrace

    - name: Build signed release APK
      env:
        KEYSTORE_FILE: ${{ runner.temp }}/release.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew clean assembleRelease --no-daemon --max-workers=1 --stacktrace -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"

    - name: Validate release APK
      run: |
        APK=app/build/outputs/apk/release/app-release.apk
        test -s "$APK"
        python3 tools/verify_16kb_compatibility.py "$APK"

    - name: Read version info
      id: version
      run: |
        CODE=$(grep "versionCode" app/build.gradle.kts | grep -o '[0-9]*')
        NAME=$(grep "versionName" app/build.gradle.kts | grep -o '"[^"]*"' | tr -d '"')
        echo "code=$CODE" >> $GITHUB_OUTPUT
        echo "name=$NAME" >> $GITHUB_OUTPUT
        echo "tag=v${NAME}+${CODE}" >> $GITHUB_OUTPUT

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/app-release.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: "Barcode To CSV ${{ steps.version.outputs.tag }}"
        body: |
          Barcode To CSV v${{ steps.version.outputs.name }} adds Near Expiry-inspired first-launch appearance onboarding with persisted dark, light, and system choices, alongside rolling recovery backups and clear add-or-replace duplicate controls. The verified Android 16 startup and 16 KB native-library safeguards remain enabled.

          Built only after successful Android lint, unit tests, signed APK validation, migration validation, and 16 KB native-library compatibility validation from commit ${{ github.sha }}.
        files: app/build/outputs/apk/release/app-release.apk
        make_latest: true
        overwrite_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
