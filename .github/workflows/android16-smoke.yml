name: Android 16 Startup Smoke Test

on:
  push:
    branches: [ "android16-smoke" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle cache
      uses: gradle/actions/setup-gradle@v4

    - name: Prepare Android emulator runtime
      run: |
        sudo apt-get update
        sudo apt-get install --yes libpulse0
        sudo chmod 666 /dev/kvm

    - name: Run Android 16 cold-launch smoke test
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 36
        target: google_apis
        arch: x86_64
        profile: Nexus 6
        disable-animations: true
        disable-linux-hw-accel: false
        emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
        script: ./gradlew connectedDebugAndroidTest --no-daemon --max-workers=1 --stacktrace -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
