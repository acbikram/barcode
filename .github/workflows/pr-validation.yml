name: Android PR Validation

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches:
      - "uiux/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validate database migrations
        run: python3 tools/verify_migrations.py

      - name: Run lint and unit tests
        run: ./gradlew lintDebug testDebugUnitTest --no-daemon --max-workers=1 --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --max-workers=1 --stacktrace

      # Merge the PR only after migration validation, lint, unit tests, and APK build all pass.
      # If branch protection requires this workflow to finish first, --auto queues the merge.
      - name: Automatically merge successful pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR_NUMBER" --squash --auto --delete-branch
